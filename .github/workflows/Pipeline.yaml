name: Pipeline.yaml

on:
  push:
    tags:
      - 'v*'
  pull_request:

env:
  PROJECT: Microlens.Cache/Microlens.Cache.csproj

jobs:
  pipeline:
    name: ⛓️ CI/CD Pipeline - Build, Pack, Publish, Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      id-token: write

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: 🔄 Restore Dependencies
      run: dotnet restore

    - name: 🛠️ Build Solution
      run: dotnet build --configuration Release --no-restore

    - name: 🏷️ Extract Version
      id: get_version
      shell: bash
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: 📦 Pack Library
      run: |
        dotnet pack ${{ env.PROJECT }} --configuration Release --no-build --output ./dist -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} -p:PackageReleaseNotes="Compiled binary drop for version tag: ${{ github.ref_name }} (Commit: ${{ github.sha }})"

    - name: 🔑 OIDC Login
      uses: NuGet/login@v1
      id: nuget_oidc
      with:
        user: ${{ secrets.NUGET_USERNAME }}

    - name: 🚀 Publish to NuGet
      run: |
        dotnet nuget push "./dist/*.nupkg" --api-key "${{ steps.nuget_oidc.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: 🚚 Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          * Compiled binary drop for version tag: `${{ github.ref_name }}`
          * Commit Reference: `${{ github.sha }}`
        files: |
          ./dist/*.nupkg
          ./dist/*.snupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
